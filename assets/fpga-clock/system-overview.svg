<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">FPGA digital clock functional overview</title>
<desc id="desc">Timekeeping and setting, alarm setting and game, and stopwatch blocks feed a shared display selector. The alarm game takes display priority. All blocks use the board clock and controls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#76986e"/></marker></defs>
<rect width="900" height="420" rx="10" fill="#f7f8f2"/>
<g font-family="Arial, sans-serif">
  <text x="36" y="33" font-size="13" letter-spacing="1.4" fill="#63735f">BASYS 3 · VERILOG / VIVADO</text>
  <text x="864" y="33" text-anchor="end" font-size="14" fill="#63735f">100 MHz clock · Switches · Pushbuttons</text>
  <g fill="none" stroke="#76986e" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M276 110H342V185H395"/>
    <path d="M276 220H395"/>
    <path d="M276 330H342V255H395"/>
    <path d="M595 220H671"/>
    <path d="M77 152V178"/>
  </g>
  <text x="90" y="170" font-size="12" fill="#63735f">Current time</text>
  <g fill="#edf2e6" stroke="#c9d5c2" stroke-width="1.2">
    <rect x="36" y="70" width="240" height="82" rx="7"/>
    <rect x="36" y="180" width="240" height="82" rx="7"/>
    <rect x="36" y="290" width="240" height="82" rx="7"/>
    <rect x="395" y="155" width="200" height="130" rx="7"/>
  </g>
  <g fill="#203b36" font-size="16" font-weight="600">
    <text x="54" y="102">Timekeeping &amp; setting</text>
    <text x="54" y="212">Alarm setting &amp; game</text>
    <text x="54" y="322">Stopwatch</text>
    <text x="495" y="188" text-anchor="middle">Display selection</text>
  </g>
  <g fill="#63735f" font-size="14">
    <text x="54" y="129">Time registers · 1-second tick</text>
    <text x="54" y="239">Time match · LED challenge</text>
    <text x="54" y="349">10-ms count · Start / pause</text>
    <text x="495" y="220" text-anchor="middle">Alarm / game priority</text>
    <text x="495" y="246" text-anchor="middle">Then active mode</text>
    <text x="633" y="208" text-anchor="middle" font-size="12">SEG / ANODE</text>
  </g>
  <rect x="675" y="155" width="189" height="130" rx="7" fill="#eaf0eb" stroke="#c9d5c2" stroke-width="1.2"/>
  <rect x="694" y="171" width="151" height="61" rx="4" fill="#203b36"/>
  <text x="769" y="215" text-anchor="middle" font-family="monospace" font-size="39" letter-spacing="3" fill="#dce7cb">00:00</text>
  <text x="769" y="259" text-anchor="middle" font-size="14" fill="#203b36">4-digit 7-segment display</text>
  <text x="36" y="402" font-size="13" fill="#63735f">Conceptual grouping of the Verilog modules; individual blocks also drive status and game LEDs.</text>
</g>
</svg>